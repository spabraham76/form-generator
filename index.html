<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fillable Form Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 820px; margin: 0 auto; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 26px; color: #1a1a1a; }
    .header p { color: #666; margin-top: 4px; }

    .card { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 32px; margin-bottom: 16px; }

    .upload-zone { border: 2px dashed #d1d5db; border-radius: 8px; padding: 48px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #2563eb; background: #eff6ff; }
    .upload-zone h3 { color: #374151; margin-bottom: 8px; }
    .upload-zone p { color: #9ca3af; font-size: 14px; }
    .upload-zone label { color: #2563eb; cursor: pointer; font-weight: 600; }
    #fileInput { display: none; }

    .file-bar { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
    .file-bar-left { display: flex; align-items: center; gap: 12px; }
    .file-icon { font-size: 30px; }
    .file-name { font-weight: 600; color: #1a1a1a; }
    .file-size { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .btn { padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: background .15s; }
    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-primary:hover   { background: #1d4ed8; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-success   { background: #059669; color: #fff; }
    .btn-success:hover   { background: #047857; }
    .btn-outline   { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn-outline:hover   { background: #f9fafb; }

    .form-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; gap: 12px; flex-wrap: wrap; }
    .form-toolbar h2 { font-size: 20px; color: #1a1a1a; }
    .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .form-section { margin-bottom: 28px; }
    .section-title { font-size: 13px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e5e7eb; }
    .field-group { margin-bottom: 16px; }
    .field-label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .required { color: #ef4444; margin-left: 2px; }

    .field-input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #1a1a1a; outline: none; transition: border-color .2s; background: #fff; }
    .field-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .field-textarea { min-height: 80px; resize: vertical; }

    .radio-group, .check-group { display: flex; flex-direction: column; gap: 8px; }
    .opt-label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .opt-label input { width: 15px; height: 15px; cursor: pointer; }

    .sig-wrap { border-bottom: 2px solid #374151; padding: 4px 0; }
    .sig-input { width: 100%; border: none; outline: none; font-size: 22px; font-family: 'Brush Script MT', cursive; color: #1a1a1a; background: transparent; }

    .loading { text-align: center; padding: 56px; }
    .loading p { color: #6b7280; margin-top: 14px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.85s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; padding: 12px 16px; margin-top: 12px; font-size: 14px; display: none; }

    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .card { box-shadow: none; padding: 0; }
      .field-input, .field-textarea, .field-select { border: none !important; border-bottom: 1px solid #000 !important; border-radius: 0 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header no-print">
    <h1>📋 Fillable Form Generator</h1>
    <p>Upload a form — get an instant fillable HTML version</p>
  </div>

  <div id="uploadSection" class="card no-print">
    <div class="upload-zone" id="dropZone">
      <div style="font-size:48px;margin-bottom:10px">☁️</div>
      <h3>Drop your form here or <label for="fileInput">browse files</label></h3>
      <p>Supports PDF, JPG, PNG, Word documents (.docx)</p>
      <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
    </div>
    <div id="fileBar" class="file-bar" style="display:none">
      <div class="file-bar-left">
        <span class="file-icon" id="fileIcon">📄</span>
        <div>
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeForm()">Generate Form</button>
    </div>
    <div class="error-banner" id="errorBanner"></div>
  </div>

  <div id="loadingSection" class="card no-print" style="display:none">
    <div class="loading">
      <div class="spinner"></div>
      <p>Analyzing your form — this takes a few seconds…</p>
    </div>
  </div>

  <div id="formSection" class="card" style="display:none">
    <div class="form-toolbar no-print">
      <h2>Generated Form</h2>
      <div class="toolbar-actions">
        <button class="btn btn-outline" onclick="resetApp()">⬆ Upload New Form</button>
        <button class="btn btn-success" onclick="downloadWord()">⬇ Download as Word</button>
        <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save PDF</button>
      </div>
    </div>
    <div id="generatedForm"></div>
  </div>

</div>
<script>
  let currentFile = null;
  let currentFields = [];

  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', ()  => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  function loadFile(file) {
    currentFile = file;
    const icons = { pdf: '📕', image: '🖼️', word: '📘' };
    const kind  = file.type === 'application/pdf' ? 'pdf'
                : file.type.startsWith('image/')  ? 'image' : 'word';
    document.getElementById('fileIcon').textContent = icons[kind];
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('fileBar').style.display = 'flex';
    hideError();
  }

  async function analyzeForm() {
    if (!currentFile) return;
    show('loadingSection'); hide('uploadSection'); hide('formSection'); hideError();

    try {
      const base64Data = await toBase64(currentFile);

      let mediaType = 'image/jpeg';
      if (currentFile.type === 'application/pdf')      mediaType = 'application/pdf';
      else if (currentFile.type.includes('png'))       mediaType = 'image/png';
      else if (currentFile.type.includes('webp'))      mediaType = 'image/webp';

      const res  = await fetch('/api/analyze', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ base64Data, mediaType })
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const text   = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const clean  = text.replace(/```json|```/g, '').trim();
      const fields = JSON.parse(clean);

      currentFields = fields;
      renderForm(fields);

      hide('loadingSection'); show('formSection');

    } catch (err) {
      hide('loadingSection'); show('uploadSection');
      showError('Error: ' + err.message + '. Please try again or convert Word files to PDF first.');
    }
  }

  function renderForm(fields) {
    const sections = {};
    fields.forEach(f => {
      const s = f.section || 'General';
      (sections[s] = sections[s] || []).push(f);
    });
    const multiSection = Object.keys(sections).length > 1;

    let html = '';
    Object.entries(sections).forEach(([name, sFields]) => {
      if (multiSection) html += `<div class="form-section"><div class="section-title">${esc(name)}</div>`;
      sFields.forEach(field => {
        const idx = fields.indexOf(field);
        html += `<div class="field-group">`;
        if (field.type !== 'checkbox') {
          html += `<label class="field-label" for="f${idx}">${esc(field.label)}${field.required ? '<span class="required">*</span>' : ''}</label>`;
        }
        html += buildInput(field, idx);
        html += `</div>`;
      });
      if (multiSection) html += `</div>`;
    });

    document.getElementById('generatedForm').innerHTML = html;
  }

  function buildInput(f, idx) {
    const ph = esc(f.placeholder || '');
    switch (f.type) {
      case 'textarea':
        return `<textarea id="f${idx}" class="field-input field-textarea" placeholder="${ph}"></textarea>`;
      case 'checkbox':
        return `<div class="check-group"><label class="opt-label"><input type="checkbox" id="f${idx}"> ${esc(f.label)}${f.required ? '<span class="required">*</span>' : ''}</label></div>`;
      case 'radio':
        return `<div class="radio-group">${(f.options||[]).map(o =>
          `<label class="opt-label"><input type="radio" name="f${idx}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`;
      case 'select':
        return `<select id="f${idx}" class="field-input"><option value="">Select…</option>${(f.options||[]).map(o =>
          `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
      case 'signature':
        return `<div class="sig-wrap"><input type="text" id="f${idx}" class="sig-input" placeholder="Sign here"></div>`;
      default:
        return `<input type="${f.type||'text'}" id="f${idx}" class="field-input" placeholder="${ph}">`;
    }
  }

  function downloadWord() {
    let rows = '';
    currentFields.forEach((f, idx) => {
      let val = '';
      if (f.type === 'checkbox') {
        const el = document.getElementById(`f${idx}`);
        val = el && el.checked ? '☑ Yes' : '☐ No';
      } else if (f.type === 'radio') {
        const sel = document.querySelector(`input[name="f${idx}"]:checked`);
        val = sel ? sel.value : '';
      } else {
        const el = document.getElementById(`f${idx}`);
        val = el ? el.value : '';
      }
      rows += `<tr>
        <td style="padding:8px 12px;border:1px solid #ccc;font-weight:bold;background:#f5f5f5;width:40%">${f.label}${f.required ? ' *' : ''}</td>
        <td style="padding:8px 12px;border:1px solid #ccc">${val || '&nbsp;'}</td>
      </tr>`;
    });

    const doc = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <style>body{font-family:Arial,sans-serif;padding:40px}h1{margin-bottom:20px;font-size:20px}
      table{width:100%;border-collapse:collapse}</style></head><body>
      <h1>Completed Form</h1>
      <table>${rows}</table></body></html>`;

    const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'completed_form.doc' });
    a.click(); URL.revokeObjectURL(a.href);
  }

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  function resetApp() {
    currentFile = null; currentFields = [];
    document.getElementById('fileInput').value = '';
    document.getElementById('fileBar').style.display = 'none';
    document.getElementById('generatedForm').innerHTML = '';
    hide('formSection'); hide('loadingSection'); show('uploadSection'); hideError();
  }

  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  function showError(msg) { const el = document.getElementById('errorBanner'); el.textContent = msg; el.style.display = 'block'; }
  function hideError()    { document.getElementById('errorBanner').style.display = 'none'; }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
