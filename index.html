<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fillable Form Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #e5e7eb; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 26px; color: #1a1a1a; }
    .header p { color: #666; margin-top: 4px; }

    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 28px; margin-bottom: 16px; }

    .upload-zone { border: 2px dashed #d1d5db; border-radius: 8px; padding: 48px; text-align: center; cursor: pointer; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #2563eb; background: #eff6ff; }
    .upload-zone h3 { color: #374151; margin-bottom: 8px; }
    .upload-zone p { color: #9ca3af; font-size: 14px; }
    .upload-zone label { color: #2563eb; cursor: pointer; font-weight: 600; }
    #fileInput { display: none; }

    .file-bar { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; border-radius: 8px; padding: 14px 16px; margin-top: 16px; }
    .file-bar-left { display: flex; align-items: center; gap: 12px; }
    .file-icon { font-size: 30px; }
    .file-name { font-weight: 600; }
    .file-size { font-size: 12px; color: #6b7280; }

    .btn { padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; }  .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: #fff; }  .btn-success:hover { background: #047857; }
    .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; } .btn-outline:hover { background: #f9fafb; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn.active { background: #1e40af; color: #fff; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar h2 { font-size: 18px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .editbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 12px; background: #f3f4f6; border-radius: 6px; font-size: 13px; }
    .editbar .sep { width: 1px; height: 20px; background: #d1d5db; }

    .page { position: relative; width: 100%; margin: 0 auto 24px; box-shadow: 0 2px 8px rgba(0,0,0,.15); background: #fff; }
    .page img { display: block; width: 100%; height: auto; -webkit-user-drag: none; }
    .page.addmode { cursor: crosshair; }

    .fld { position: absolute; }
    .fld input[type=text], .fld textarea {
      width: 100%; height: 100%; border: 1px dashed rgba(37,99,235,.7); background: rgba(37,99,235,.08);
      font-family: Arial, sans-serif; font-size: 13px; padding: 0 3px; outline: none; resize: none; color: #000;
    }
    .fld input[type=text]:focus, .fld textarea:focus { background: rgba(37,99,235,.15); border-style: solid; }
    .fld.sig input { font-family: 'Brush Script MT', cursive; font-size: 18px; }
    .fld.chk { display: flex; align-items: center; justify-content: center; }
    .fld.chk input { width: 100%; height: 100%; max-width: 22px; max-height: 22px; margin: 0; cursor: pointer; }
    .fld.selected input, .fld.selected textarea { border: 2px solid #dc2626 !important; background: rgba(220,38,38,.1) !important; }

    .handle { position: absolute; width: 12px; height: 12px; background: #2563eb; border: 1px solid #fff; border-radius: 50%; opacity: 0; transition: opacity .12s; }
    .fld:hover .handle, .fld.selected .handle { opacity: 1; }
    .handle.move { top: -8px; left: -8px; cursor: move; }
    .handle.resize { bottom: -8px; right: -8px; cursor: nwse-resize; background: #059669; }
    .handle.del { top: -8px; right: -8px; cursor: pointer; background: #dc2626; width: 14px; height: 14px; color: #fff; font-size: 10px; line-height: 12px; text-align: center; }
    .fld.dragging { z-index: 20; }

    .loading { text-align: center; padding: 56px; }
    .loading p { color: #6b7280; margin-top: 14px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin .85s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-banner { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; padding: 12px 16px; margin-top: 12px; font-size: 14px; display: none; }

    @media print {
      @page { margin: 0; }
      .no-print { display: none !important; }
      body { background: #fff; padding: 0; }
      .container { max-width: none; }
      .card { box-shadow: none; padding: 0; border-radius: 0; }
      .page { box-shadow: none; margin: 0; page-break-after: always; }
      .page:last-child { page-break-after: auto; }
      .fld input[type=text], .fld textarea { border: none !important; background: transparent !important; }
      .handle { display: none !important; }
      .fld input[type=checkbox] { -webkit-appearance: checkbox; appearance: checkbox; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header no-print">
    <h1>📋 Fillable Form Generator</h1>
    <p>Upload a form — fill it in directly on the original layout</p>
  </div>

  <div id="uploadSection" class="card no-print">
    <div class="upload-zone" id="dropZone">
      <div style="font-size:48px;margin-bottom:10px">☁️</div>
      <h3>Drop your form here or <label for="fileInput">browse files</label></h3>
      <p>Supports PDF, JPG, PNG. For Word documents, save as PDF first.</p>
      <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">
    </div>
    <div id="fileBar" class="file-bar" style="display:none">
      <div class="file-bar-left">
        <span class="file-icon" id="fileIcon">📄</span>
        <div><div class="file-name" id="fileName"></div><div class="file-size" id="fileSize"></div></div>
      </div>
      <button class="btn btn-primary" onclick="analyzeForm()">Generate Form</button>
    </div>
    <div class="error-banner" id="errorBanner"></div>
  </div>

  <div id="loadingSection" class="card no-print" style="display:none">
    <div class="loading"><div class="spinner"></div><p id="loadingMsg">Analyzing your form…</p></div>
  </div>

  <div id="formSection" class="card" style="display:none">
    <div class="toolbar no-print">
      <h2>Fill in your form</h2>
      <div class="toolbar-actions">
        <button class="btn btn-outline" onclick="resetApp()">⬆ Upload New</button>
        <button class="btn btn-success" onclick="downloadWord()">⬇ Word</button>
        <button class="btn btn-primary" onclick="window.print()">🖨 Print / PDF</button>
      </div>
    </div>
    <div class="editbar no-print">
      <strong>Edit:</strong>
      <button class="btn btn-outline btn-sm" id="addTextBtn" onclick="toggleAdd('text')">+ Text field</button>
      <button class="btn btn-outline btn-sm" id="addCheckBtn" onclick="toggleAdd('checkbox')">+ Checkbox</button>
      <span class="sep"></span>
      <span id="editHint" style="color:#6b7280">Hover a field: drag <b style="color:#2563eb">blue</b> to move, <b style="color:#059669">green</b> to resize, <b style="color:#dc2626">×</b> to delete.</span>
    </div>
    <div id="pages"></div>
  </div>

</div>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let currentFile = null;
  let pages = [];          // [{ dataUrl, fields:[], words:[] }]
  let addMode = null;      // null | 'text' | 'checkbox'

  document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  function loadFile(file) {
    currentFile = file;
    document.getElementById('fileIcon').textContent = file.type === 'application/pdf' ? '📕' : '🖼️';
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('fileBar').style.display = 'flex';
    hideError();
  }

  // Render PDF pages to images AND pull exact word positions (digital PDFs)
  async function fileToPages(file) {
    if (file.type === 'application/pdf') {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const out = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        setLoading(`Rendering page ${i} of ${pdf.numPages}…`);
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 2 });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

        // Extract word positions as % of page
        const tc = await page.getTextContent();
        const words = tc.items.filter(it => it.str && it.str.trim()).map(it => {
          const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
          const x = tx[4], yTop = tx[5] - it.height * 2;
          return {
            t: it.str.trim(),
            x: +(x / vp.width * 100).toFixed(2),
            y: +(yTop / vp.height * 100).toFixed(2),
            w: +(it.width * 2 / vp.width * 100).toFixed(2),
            h: +(it.height * 2 / vp.height * 100).toFixed(2)
          };
        });
        out.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), words });
      }
      return out;
    }
    if (file.type.startsWith('image/')) {
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      return [{ dataUrl, words: [] }];
    }
    throw new Error('Unsupported file type. Save Word documents as PDF first.');
  }

  async function analyzeForm() {
    if (!currentFile) return;
    show('loadingSection'); hide('uploadSection'); hide('formSection'); hideError();
    try {
      const raw = await fileToPages(currentFile);
      pages = [];
      for (let i = 0; i < raw.length; i++) {
        setLoading(`Detecting fields on page ${i + 1} of ${raw.length}…`);
        const base64Data = raw[i].dataUrl.split(',')[1];
        const res = await fetch('/api/analyze', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Data, mediaType: 'image/jpeg', words: raw[i].words })
        });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
        const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
        const fields = JSON.parse(text.replace(/```json|```/g, '').trim());
        pages.push({ dataUrl: raw[i].dataUrl, fields, words: raw[i].words });
      }
      renderPages();
      hide('loadingSection'); show('formSection');
    } catch (err) {
      hide('loadingSection'); show('uploadSection');
      showError('Error: ' + err.message);
    }
  }

  function renderPages() {
    const wrap = document.getElementById('pages'); wrap.innerHTML = '';
    pages.forEach((p, pi) => {
      const pg = document.createElement('div'); pg.className = 'page'; pg.dataset.pi = pi;
      const img = document.createElement('img'); img.src = p.dataUrl; pg.appendChild(img);
      p.fields.forEach((f, fi) => pg.appendChild(buildField(f, pi, fi)));
      pg.addEventListener('click', e => { if (addMode && e.target === img) addFieldAt(e, pi); });
      wrap.appendChild(pg);
    });
  }

  function buildField(f, pi, fi) {
    const d = document.createElement('div');
    d.className = 'fld' + (f.type === 'checkbox' ? ' chk' : f.type === 'signature' ? ' sig' : '');
    d.style.left = f.x + '%'; d.style.top = f.y + '%'; d.style.width = f.w + '%'; d.style.height = f.h + '%';
    d.title = f.label || '';
    const id = `p${pi}f${fi}`;
    if (f.type === 'checkbox') d.innerHTML = `<input type="checkbox" id="${id}">`;
    else if (f.type === 'textarea') d.innerHTML = `<textarea id="${id}"></textarea>`;
    else d.innerHTML = `<input type="text" id="${id}">`;

    const mv = mkHandle('move'); const rz = mkHandle('resize'); const dl = mkHandle('del'); dl.textContent = '×';
    d.append(mv, rz, dl);
    dragMove(d, mv, f); dragResize(d, rz, f);
    dl.addEventListener('click', ev => { ev.stopPropagation(); pages[pi].fields.splice(fi, 1); renderPages(); });
    d.addEventListener('click', ev => { ev.stopPropagation(); document.querySelectorAll('.fld.selected').forEach(x => x.classList.remove('selected')); d.classList.add('selected'); });
    return d;
  }
  function mkHandle(kind) { const h = document.createElement('div'); h.className = 'handle ' + kind; return h; }

  function dragMove(el, handle, f) {
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const rect = el.parentElement.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY, sl = f.x, st = f.y;
      el.classList.add('dragging');
      const move = ev => { f.x = sl + (ev.clientX - sx) / rect.width * 100; f.y = st + (ev.clientY - sy) / rect.height * 100; el.style.left = f.x + '%'; el.style.top = f.y + '%'; };
      const up = () => { el.classList.remove('dragging'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    });
  }
  function dragResize(el, handle, f) {
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const rect = el.parentElement.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY, sw = f.w, sh = f.h;
      el.classList.add('dragging');
      const move = ev => {
        f.w = Math.max(1, sw + (ev.clientX - sx) / rect.width * 100);
        f.h = Math.max(1, sh + (ev.clientY - sy) / rect.height * 100);
        el.style.width = f.w + '%'; el.style.height = f.h + '%';
      };
      const up = () => { el.classList.remove('dragging'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    });
  }

  function toggleAdd(kind) {
    addMode = addMode === kind ? null : kind;
    document.getElementById('addTextBtn').classList.toggle('active', addMode === 'text');
    document.getElementById('addCheckBtn').classList.toggle('active', addMode === 'checkbox');
    document.querySelectorAll('.page').forEach(pg => pg.classList.toggle('addmode', !!addMode));
    document.getElementById('editHint').textContent = addMode ? `Click on the form to place a ${addMode}.` : 'Hover a field: drag blue to move, green to resize, × to delete.';
  }
  function addFieldAt(e, pi) {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * 100;
    const y = (e.clientY - rect.top) / rect.height * 100;
    const f = addMode === 'checkbox' ? { label: 'Checkbox', type: 'checkbox', x: x - 1, y: y - 1, w: 2, h: 1.6 }
                                     : { label: 'Field', type: 'text', x, y: y - 1.2, w: 25, h: 2.4 };
    pages[pi].fields.push(f); toggleAdd(addMode); renderPages();
  }

  function downloadWord() {
    let body = '';
    pages.forEach((p, pi) => {
      body += `<img src="${p.dataUrl}" style="width:100%"><br>`;
      let rows = '';
      p.fields.forEach((f, fi) => {
        const el = document.getElementById(`p${pi}f${fi}`);
        let val = f.type === 'checkbox' ? (el && el.checked ? '☑' : '') : (el ? el.value : '');
        if (val) rows += `<tr><td style="padding:6px 10px;border:1px solid #ccc;font-weight:bold;width:40%">${esc(f.label || '')}</td><td style="padding:6px 10px;border:1px solid #ccc">${esc(val)}</td></tr>`;
      });
      if (rows) body += `<h3 style="margin:12px 0 6px">Page ${pi + 1} — entered values</h3><table style="width:100%;border-collapse:collapse">${rows}</table>`;
      body += `<br style="page-break-before:always">`;
    });
    const doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif}</style></head><body>${body}</body></html>`;
    const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'completed_form.doc' });
    a.click(); URL.revokeObjectURL(a.href);
  }

  function resetApp() {
    currentFile = null; pages = []; addMode = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('fileBar').style.display = 'none';
    document.getElementById('pages').innerHTML = '';
    hide('formSection'); hide('loadingSection'); show('uploadSection'); hideError();
  }
  function setLoading(m) { document.getElementById('loadingMsg').textContent = m; }
  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  function showError(m) { const el = document.getElementById('errorBanner'); el.textContent = m; el.style.display = 'block'; }
  function hideError() { document.getElementById('errorBanner').style.display = 'none'; }
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
</script>
</body>
</html>
